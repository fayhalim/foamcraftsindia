    <script>
      try {
        // Prevent third-party libraries (like Firebase/polyfills) from crashing the app 
        // in iframe environments that mock window.fetch with a getter-only property.
        let originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function(val) { originalFetch = val; },
          configurable: true
        });
      } catch (e) {
        console.warn('Failed to redefine window.fetch:', e);
      }
    </script>
